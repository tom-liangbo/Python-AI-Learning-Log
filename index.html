<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的云端知识库</title>
    <!-- 引入 Markdown 解析库和 Base64 编码库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-base64@3.7.5/base64.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f6f8fa; color: #24292f; }
        
        /* 侧边栏 */
        .sidebar { width: 300px; background: #fff; border-right: 1px solid #d0d7de; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #d0d7de; }
        .sidebar-header h2 { font-size: 18px; margin-bottom: 10px; }
        .btn { background: #2da44e; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%; margin-bottom: 8px; text-align: center; transition: 0.2s;}
        .btn:hover { background: #2c974b; }
        .btn-sync { background: #0969da; }
        .btn-sync:hover { background: #0969da; opacity: 0.9;}
        .btn-sync:disabled { background: #8c959f; cursor: not-allowed; }
        
        /* 笔记列表 */
        .note-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; }
        .note-item { padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s;}
        .note-item:hover { background: #f3f4f6; }
        .note-item.active { background: #ddf4ff; font-weight: bold; }
        
        /* 列表内删除按钮 */
        .list-del-btn { color: #cf222e; background: none; border: none; cursor: pointer; font-size: 18px; font-weight: bold; line-height: 1; display: none; padding: 0 5px; }
        .list-del-btn:hover { color: #a40e26; }
        .note-item:hover .list-del-btn { display: block; } /* 鼠标悬浮时才显示删除按钮 */
        
        /* 主内容区 */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; background: #fff; margin: 15px; border-radius: 6px; border: 1px solid #d0d7de; }
        .editor-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .title-input { font-size: 24px; border: none; outline: none; font-weight: bold; width: 100%; }
        .textarea { width: 100%; height: 50vh; border: 1px solid #d0d7de; border-radius: 6px; padding: 15px; font-size: 16px; resize: none; outline: none; font-family: monospace;}
        .preview { margin-top: 20px; padding-top: 20px; border-top: 1px dashed #d0d7de; line-height: 1.6; }
        .preview h1, .preview h2, .preview h3 { margin-top: 15px; margin-bottom: 10px; }
        .preview p { margin-bottom: 10px; }
        .preview pre { background: #f6f8fa; padding: 10px; border-radius: 6px; overflow-x: auto; }
        .preview code { background: #f6f8fa; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #57606a; }
        .token-input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #d0d7de; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>☁️ 云端知识库</h2>
            <button class="btn btn-sync" id="pullBtn" onclick="pullFromCloud()">↓ 拉取云端最新数据</button>
            <button class="btn" id="newBtn" onclick="createNewNote()">+ 新建笔记</button>
            <button class="btn" id="pushBtn" style="background:#57606a;" onclick="pushToCloud()">↑ 保存到云端</button>
        </div>
        <ul class="note-list" id="noteList"></ul>
    </div>

    <div class="main-content" id="mainContent">
        <!-- 初始状态 / 绑定页面 -->
        <div class="empty-state" id="setupState" style="display: none;">
            <h2>⚙️ 请先绑定你的 GitHub 仓库</h2>
            <p style="margin-top: 10px;">你的数据将安全地保存在你自己的仓库中。</p>
            <input type="password" id="tokenInput" class="token-input" placeholder="粘贴你的 GitHub Token (ghp_...)">
            <input type="text" id="ownerInput" class="token-input" placeholder="你的 GitHub 用户名" value="tom-liangbo">
            <input type="text" id="repoInput" class="token-input" placeholder="仓库名称" value="Python-AI-Learning-Log">
            <button class="btn btn-sync" onclick="saveConfig()">连接云端</button>
        </div>
        
        <!-- 空白提示页面 -->
        <div class="empty-state" id="blankState" style="display: none;">
            <h2>请在左侧选择或新建一篇笔记</h2>
        </div>

        <!-- 编辑区 -->
        <div id="editorArea" style="display: none; width: 100%;">
            <div class="editor-header">
                <input type="text" id="noteTitle" class="title-input" placeholder="输入标题..." oninput="updatePreview()">
            </div>
            <textarea id="noteContent" class="textarea" placeholder="支持 Markdown 语法。修改后记得点击左侧【保存到云端】。" oninput="updatePreview()"></textarea>
            <div class="preview" id="notePreview"></div>
        </div>
    </div>

    <script>
        // 配置信息
        let config = JSON.parse(localStorage.getItem('gh_config')) || { token: '', owner: '', repo: '' };
        let notes = JSON.parse(localStorage.getItem('my_cloud_notes')) || [];
        let currentNoteId = null;

        // 初始化
        function init() {
            if (config.token) {
                document.getElementById('setupState').style.display = 'none';
                if(notes.length > 0) {
                    selectNote(notes[0].id);
                } else {
                    showBlankState();
                }
                // 自动拉取最新数据
                pullFromCloud();
            } else {
                document.getElementById('setupState').style.display = 'flex';
                document.getElementById('editorArea').style.display = 'none';
                document.getElementById('blankState').style.display = 'none';
            }
            renderList();
        }
        init();

        function showBlankState() {
            document.getElementById('blankState').style.display = 'flex';
            document.getElementById('editorArea').style.display = 'none';
            currentNoteId = null;
            renderList();
        }

        // 保存配置
        function saveConfig() {
            const token = document.getElementById('tokenInput').value.trim();
            const owner = document.getElementById('ownerInput').value.trim();
            const repo = document.getElementById('repoInput').value.trim();
            if (!token || !owner || !repo) return alert('请填写完整信息！');
            
            config = { token, owner, repo };
            localStorage.setItem('gh_config', JSON.stringify(config));
            init();
        }

        // 渲染左侧列表
        function renderList() {
            const listEl = document.getElementById('noteList');
            listEl.innerHTML = '';
            
            notes.forEach(note => {
                const li = document.createElement('li');
                li.className = `note-item ${note.id === currentNoteId ? 'active' : ''}`;
                
                // 文本区域
                const span = document.createElement('span');
                span.innerText = note.title || '无标题笔记';
                span.style.flex = "1";
                span.style.overflow = "hidden";
                span.style.textOverflow = "ellipsis";
                span.style.whiteSpace = "nowrap";
                span.onclick = () => selectNote(note.id); // 点击文字选中

                // 删除按钮（悬浮显示）
                const delBtn = document.createElement('button');
                delBtn.innerText = '×';
                delBtn.className = 'list-del-btn';
                delBtn.title = "删除此笔记";
                delBtn.onclick = (e) => {
                    e.stopPropagation(); // 阻止触发选中事件
                    deleteNoteById(note.id);
                };

                li.appendChild(span);
                li.appendChild(delBtn);
                listEl.appendChild(li);
            });
        }

        // 选择笔记
        function selectNote(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id === id);
            if(!note) return;
            
            document.getElementById('blankState').style.display = 'none';
            document.getElementById('setupState').style.display = 'none';
            document.getElementById('editorArea').style.display = 'block';
            
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            updatePreview();
            renderList();
        }

        // 新建笔记
        function createNewNote() {
            if (!config.token) return alert("请先配置 Token！");
            const newNote = { id: Date.now().toString(), title: '新笔记', content: '' };
            notes.unshift(newNote);
            saveToLocal();
            selectNote(newNote.id);
        }

        // 按 ID 删除笔记
        function deleteNoteById(id) {
            if(!confirm('确定要删除这篇笔记吗？')) return;
            
            notes = notes.filter(n => n.id !== id);
            saveToLocal();
            
            // 如果删除的是当前选中的笔记
            if (currentNoteId === id) {
                if (notes.length > 0) {
                    selectNote(notes[0].id); // 自动选中第一篇
                } else {
                    showBlankState(); // 全删光了，显示空白页
                }
            } else {
                renderList();
            }
        }

        // 实时保存到浏览器缓存并更新预览
        function updatePreview() {
            if(!currentNoteId) return;
            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;
            const noteIndex = notes.findIndex(n => n.id === currentNoteId);
            
            if(noteIndex !== -1) {
                notes[noteIndex].title = title;
                notes[noteIndex].content = content;
                saveToLocal(); // 先存本地，防丢
            }
            document.getElementById('notePreview').innerHTML = content ? marked.parse(content) : '';
            renderList(); 
        }

        // 存到浏览器本地缓存
        function saveToLocal() {
            localStorage.setItem('my_cloud_notes', JSON.stringify(notes));
        }

        // ================= GitHub API 交互 =================
        
        const FILE_PATH = 'notes_data.json';

        // 从云端拉取
        async function pullFromCloud() {
            if(!config.token) return;
            const pullBtn = document.getElementById('pullBtn');
            pullBtn.innerText = '⏳ 正在拉取...';
            pullBtn.disabled = true;
            
            try {
                const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${FILE_PATH}`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${config.token}` }
                });
                
                if (res.status === 404) {
                    alert('云端还没有数据，你可以新建笔记后点击“保存到云端”。');
                } else if (res.ok) {
                    const data = await res.json();
                    const decoded = JSON.parse(Base64.decode(data.content));
                    notes = decoded;
                    saveToLocal();
                    if(notes.length > 0) selectNote(notes[0].id);
                    renderList();
                    alert('✅ 已拉取云端最新数据！');
                } else {
                    alert('拉取失败，请检查 Token 或仓库名是否正确，或网络连接状况。');
                }
            } catch (e) {
                alert('网络错误：' + e.message);
            }
            pullBtn.innerText = '↓ 拉取云端最新数据';
            pullBtn.disabled = false;
        }

        // 推送到云端
        async function pushToCloud() {
            if(!config.token) return alert('请先配置 Token！');
            if(notes.length === 0) return alert('没有可保存的数据！');
            
            const pushBtn = document.getElementById('pushBtn');
            pushBtn.innerText = '⏳ 正在保存...';
            pushBtn.disabled = true;

            try {
                const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${FILE_PATH}`;
                
                // 1. 获取现有文件 SHA
                let sha = null;
                const getRes = await fetch(url, {
                    headers: { 'Authorization': `token ${config.token}` }
                });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }

                // 2. 转 Base64
                const contentStr = JSON.stringify(notes, null, 2);
                const contentBase64 = Base64.encode(contentStr);

                // 3. PUT 请求覆盖文件
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: '更新云端笔记数据',
                        content: contentBase64,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    alert('🚀 成功保存到 GitHub 云端！可以在其他设备拉取了。');
                } else {
                    const errData = await putRes.json();
                    alert('保存失败：' + (errData.message || '未知错误'));
                }
            } catch (e) {
                alert('网络错误：' + e.message);
            }
            pushBtn.innerText = '↑ 保存到云端';
            pushBtn.disabled = false;
        }
    </script>
</body>
</html>
